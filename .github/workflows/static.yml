name: Publicar site Abrace

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependências
        run: npm ci

      - name: Gerar site otimizado
        run: npx vite build

      - name: Criar entrada do site
        run: |
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Abrace</title>
            <script>
              location.replace("./html/index.html" + location.search + location.hash);
            </script>
          </head>
          <body>
            <a href="./html/index.html">Acessar o site Abrace</a>
          </body>
          </html>
          EOF

      - name: Enviar arquivos de produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
